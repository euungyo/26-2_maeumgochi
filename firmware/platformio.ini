[platformio]
default_envs = xiao_esp32s3_plus
boards_dir = boards

[esp32_common]
platform = espressif32 @ ~8.0.0
board = seeed_xiao_esp32s3_plus
framework = arduino
monitor_speed = 115200
monitor_filters =
  time
  esp32_exception_decoder
upload_speed = 460800
build_flags =
  -Wall
  -Wextra

[project_libraries]
lib_deps =
  sparkfun/SparkFun BMI270 Arduino Library @ 1.0.3
  adafruit/Adafruit LTR390 Library @ 1.1.2
  adafruit/RTClib @ 2.1.4
  mikalhart/TinyGPSPlus @ 1.0.3
  adafruit/Adafruit GFX Library @ 1.12.6
  adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0

; 실제 제품 펌웨어. 진단용 소스는 이 환경에서 제외합니다.
[env:xiao_esp32s3_plus]
extends = esp32_common
lib_deps = ${project_libraries.lib_deps}
build_src_filter =
  +<*>
  -<diagnostics/>

; I2C 센서의 배선과 주소를 확인하는 독립 실행 환경입니다.
[env:i2c_scanner]
extends = esp32_common
build_src_filter =
  -<*>
  +<diagnostics/i2c_scanner.cpp>

[env:bmi270_check]
extends = esp32_common
lib_deps = sparkfun/SparkFun BMI270 Arduino Library @ 1.0.3
build_src_filter =
  -<*>
  +<diagnostics/bmi270_check.cpp>

[env:ltr390_check]
extends = esp32_common
lib_deps = adafruit/Adafruit LTR390 Library @ 1.1.2
build_src_filter =
  -<*>
  +<diagnostics/ltr390_check.cpp>

[env:pcf8523_check]
extends = esp32_common
lib_deps = adafruit/RTClib @ 2.1.4
build_src_filter =
  -<*>
  +<diagnostics/pcf8523_check.cpp>

[env:l76k_check]
extends = esp32_common
lib_deps = mikalhart/TinyGPSPlus @ 1.0.3
build_src_filter =
  -<*>
  +<diagnostics/l76k_check.cpp>

; Arduino/ESP32에 의존하지 않는 core 로직을 PC에서 빠르게 시험합니다.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  -<*>
  +<core/>
  +<ui/button_gesture.cpp>
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Wpedantic

name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"

      - name: Run native unit tests
        run: pio test -d firmware -e native

      - name: Build firmware and hardware diagnostics
        run: >-
          pio run -d firmware
          -e xiao_esp32s3_plus
          -e i2c_scanner
          -e bmi270_check
          -e ltr390_check
          -e pcf8523_check
          -e l76k_check
